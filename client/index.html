<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La carte du vacarme</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      body.idle, body.idle * { cursor: none !important; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; display: none;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fc3d9;
        background: rgba(0, 0, 0, 0.6); border: 1px solid #1d2c38; border-radius: 4px; white-space: pre;
        pointer-events: none;
      }
      #hud.on { display: block; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center; color: #4d6878;
        font: 13px ui-monospace, monospace; letter-spacing: 0.08em; pointer-events: none;
      }
      .tp-dfwv { width: 320px !important; }
      #science { position: fixed; top: 12px; left: 12px; z-index: 10; max-width: min(440px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 10px 12px; border: 1px solid #526777; border-radius: 5px; color: #d6e2e8; background: rgba(8, 18, 27, .94); font: 12px/1.5 system-ui, sans-serif; }
      #science summary { cursor: pointer; font-weight: 600; }
      #science label { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0; }
      #science p, #science pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="status">la carte du vacarme</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

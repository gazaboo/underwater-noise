<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La carte du vacarme</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      body.idle, body.idle * { cursor: none !important; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; display: none;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fc3d9;
        background: rgba(0, 0, 0, 0.6); border: 1px solid #1d2c38; border-radius: 4px; white-space: pre;
        pointer-events: none;
      }
      #hud.on { display: block; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center; color: #4d6878;
        font: 13px ui-monospace, monospace; letter-spacing: 0.08em; pointer-events: none;
      }
      [hidden] { display: none !important; }
      .scene-switcher, .scene-reopen { position: fixed; z-index: 5; left: 28px; top: 28px; color: #eee6d6;
        font-family: ui-sans-serif, system-ui, sans-serif; }
      .scene-switcher { width: min(580px, calc(100vw - 56px)); padding: 22px; box-sizing: border-box;
        border: 1px solid #d7c59e36; border-radius: 20px; background: linear-gradient(130deg, #182329eb, #10191fe0);
        box-shadow: 0 20px 70px #0006, inset 0 1px #fff1; backdrop-filter: blur(18px); }
      .scene-switcher-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
      .scene-eyebrow { color: #baa984; font-size: 9px; letter-spacing: .24em; }
      .scene-switcher h1 { font: 26px/1.1 Georgia, serif; font-weight: normal; margin: 8px 0 0; }
      .scene-hide, .scene-reopen { font-family: inherit; border: 1px solid #c9bd9e50; border-radius: 20px; background: #152129e8;
        color: #d4c9b2; padding: 8px 12px; font-size: 10px; cursor: pointer; }
      .scene-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .scene-choice { font-family: inherit; border: 1px solid #b8b49e25; border-radius: 12px; padding: 12px 8px 10px; text-align: left;
        color: #d4d4c6; background: #ffffff05; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
      .scene-choice:hover { background: #ffffff12; transform: translateY(-2px); }
      .scene-choice[aria-pressed=true] { border-color: #dfc38b; background: linear-gradient(160deg, #d8bb7730, #ffffff08); box-shadow: inset 0 1px #ffe9ae35; }
      .scene-choice:disabled { opacity: .4; cursor: default; transform: none; }
      .scene-choice small { display: block; font-size: 8px; color: #a1ada8; margin: 12px 0 5px; line-height: 1.4; }
      .scene-choice strong { display: block; font-size: 11px; font-weight: 500; }
      .scene-sample { display: block; width: 44px; height: 44px; border-radius: 50%; margin: 0 auto; box-shadow: inset -8px -9px 12px #0009, 0 6px 12px #0005;
        background: radial-gradient(ellipse at 35% 30%, #93916a 0 22%, transparent 24%), radial-gradient(ellipse at 65% 65%, #6e7f53 0 24%, #254757 26%); }
      .scene-choice-painted .scene-sample { background: radial-gradient(ellipse at 28% 30%, #e3cd86 0 24%, transparent 27%), radial-gradient(ellipse at 65% 65%, #9db87d 0 27%, #356575 30%); filter: contrast(1.1); }
      .scene-choice-sculpted .scene-sample { background: radial-gradient(ellipse at 30% 30%, #c7d497 0 20%, #9a8a59 22% 29%, transparent 32%), radial-gradient(ellipse at 70% 70%, #aca875 0 25%, #387a89 30%); box-shadow: inset -8px -9px 9px #0009, inset 3px 4px 4px #f9e1b970, 0 6px 12px #0005; }
      .scene-choice-faceted .scene-sample { border-radius: 35% 45% 36% 42%; background: conic-gradient(from 30deg, #849063, #d5bb8d, #576848, #35576b, #aab178, #849063); }
      .scene-note { font-size: 10px; line-height: 1.7; color: #a5afa9; margin: 15px 0 0; }
      .scene-reopen { font-size: 11px; }
      .scene-switcher button:focus-visible, .scene-reopen:focus-visible { outline: 2px solid #f6dd9e; outline-offset: 3px; }
      @media (max-width: 650px) { .scene-switcher, .scene-reopen { top: 12px; left: 12px; } .scene-switcher { width: calc(100vw - 24px); padding: 15px; } .scene-switcher h1 { font-size: 22px; } .scene-choices { gap: 5px; } .scene-choice { padding: 10px 5px; } .scene-choice strong { font-size: 10px; } }
      @media (prefers-reduced-motion: reduce) { .scene-choice { transition: none; } }
      .tp-dfwv { width: 320px !important; }
    </style>
  </head>
  <body>
    <div id="status">la carte du vacarme</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

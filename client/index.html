<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La carte du vacarme</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      body.idle, body.idle * { cursor: none !important; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; display: none;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fc3d9;
        background: rgba(0, 0, 0, 0.6); border: 1px solid #1d2c38; border-radius: 4px; white-space: pre;
        pointer-events: none;
      }
      #hud.on { display: block; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center; color: #4d6878;
        font: 13px ui-monospace, monospace; letter-spacing: 0.08em; pointer-events: none;
      }
      .tp-dfwv { width: 320px !important; }
      #legend { position: fixed; right: 16px; bottom: 16px; max-width: min(400px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 8px; background: rgba(6, 12, 18, .78); color: #e4ebef; font: 13px/1.4 system-ui, sans-serif; pointer-events: none; backdrop-filter: blur(3px); }
      #legend.projector { font-size: 17px; max-width: 520px; }
      #legend.day { background: rgba(250, 247, 240, .86); color: #1f2a30; }
      #legend i { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 3px; vertical-align: -0.2em; margin-right: .45em; }
      #legend .lg-title { font-weight: 700; font-size: 1.15em; }
      #legend .lg-sub, #legend .lg-note, #legend .lg-tags, #propagation { opacity: .8; font-size: .85em; }
      #legend .lg-steps { display: flex; gap: 14px; margin: 8px 0 4px; }
      #legend .lg-step { display: flex; flex-direction: column; align-items: flex-start; }
      #legend .lg-step i { width: 2.6em; height: .8em; border-radius: 2px; }
      #legend .lg-step small { opacity: .75; }
      #legend .lg-row { margin: 6px 0; font-size: .9em; }
      #legend .lg-hatch { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, #fff) 0 2px, transparent 2px 6px); border: 1px solid #ffffff33; }
      #legend.day .lg-hatch { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 6px); }
      #legend .lg-species { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 6px; font-size: .9em; }
      #legend .lg-species i { border-radius: 50%; width: .8em; height: .8em; vertical-align: 0; }
      #legend .lg-species small { opacity: .65; }
      #legend .lg-tags, #propagation { margin-top: 6px; font-size: .75em; }
      #science[open] ~ #legend { display: none; }
      #legend.collapsed > :not(.lg-title) { display: none; }
      #toolbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 24px); z-index: 5; }
      #toolbar button { font: 600 13px/1 system-ui, sans-serif; padding: 9px 12px; border-radius: 18px; border: 1px solid #ffffff33; background: rgba(6, 12, 18, .8); color: #e4ebef; }
      @media (max-width: 700px) {
        #legend { left: 12px; right: 12px; bottom: auto; top: 12px; max-width: none; font-size: 12px; }
        #science { display: none; }
        .tp-dfwv { display: none; }
      }
      #science { position: fixed; top: 12px; left: 12px; z-index: 10; max-width: min(440px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 10px 12px; border: 1px solid #526777; border-radius: 5px; color: #d6e2e8; background: rgba(8, 18, 27, .94); font: 12px/1.5 system-ui, sans-serif; }
      #science[open] ~ #propagation { display: none; }
      #science summary { cursor: pointer; font-weight: 600; }
      #science label { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0; }
      #science p, #science pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="status">la carte du vacarme</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

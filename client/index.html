<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La carte du vacarme</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      body.idle, body.idle * { cursor: none !important; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; display: none;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fc3d9;
        background: rgba(0, 0, 0, 0.6); border: 1px solid #1d2c38; border-radius: 4px; white-space: pre;
        pointer-events: none;
      }
      #hud.on { display: block; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center; color: #4d6878;
        font: 13px ui-monospace, monospace; letter-spacing: 0.08em; pointer-events: none;
      }
      .tp-dfwv { width: 320px !important; }
      #legend { position: fixed; right: 16px; bottom: 16px; max-width: min(400px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 8px; background: rgba(6, 12, 18, .78); color: #e4ebef; font: 13px/1.4 system-ui, sans-serif; pointer-events: none; backdrop-filter: blur(3px); }
      #legend.projector { font-size: 17px; max-width: 520px; }
      #legend.day { background: rgba(250, 247, 240, .86); color: #1f2a30; }
      #legend i { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 3px; vertical-align: -0.2em; margin-right: .45em; }
      #legend .lg-title { font-weight: 700; font-size: 1.15em; }
      #legend .lg-sub, #legend .lg-note, #legend .lg-tags, #propagation { opacity: .8; font-size: .85em; }
      #legend .lg-steps { display: flex; gap: 14px; margin: 8px 0 4px; }
      #legend [hidden] { display: none; }
      #legend .lg-step { display: flex; flex-direction: column; align-items: flex-start; }
      #legend .lg-step i { width: 2.6em; height: .8em; border-radius: 2px; }
      #legend .lg-step small { opacity: .75; }
      #legend .lg-row { margin: 6px 0; font-size: .9em; }
      #legend .lg-hatch { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, #fff) 0 2px, transparent 2px 6px); border: 1px solid #ffffff33; }
      #legend.day .lg-hatch { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 6px); }
      #legend .lg-species { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 6px; font-size: .9em; }
      #legend .lg-species i { border-radius: 50%; width: .8em; height: .8em; vertical-align: 0; }
      #legend .lg-species small { opacity: .65; }
      #legend .lg-tags, #propagation { margin-top: 6px; font-size: .75em; }
      #science[open] ~ #legend { display: none; }
      #legend.collapsed > :not(.lg-title) { display: none; }
      #toolbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 24px); z-index: 5; }
      #toolbar button { font: 600 13px/1 system-ui, sans-serif; padding: 9px 12px; border-radius: 18px; border: 1px solid #ffffff33; background: rgba(6, 12, 18, .8); color: #e4ebef; }
      @media (max-width: 700px) {
        #legend { left: 12px; right: 12px; bottom: auto; top: 12px; max-width: none; font-size: 12px; }
        #science { display: none; }
        .tp-dfwv { display: none; }
      }
      #fiche { position: fixed; top: 12px; right: 12px; z-index: 9; width: min(390px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; box-sizing: border-box; padding: 0 14px 12px; border: 1px solid #526777; border-radius: 8px; color: #e4ebef; background: rgba(8, 18, 27, .95); font: 13px/1.45 system-ui, sans-serif; --sp: #5cb8ff; }
      #fiche[hidden], body.fiche-open #legend { display: none; }
      #fiche figure { margin: 0 -14px 8px; position: relative; }
      #fiche img { display: block; width: 100%; height: auto; border-radius: 8px 8px 0 0; }
      #fiche figcaption { position: absolute; right: 6px; bottom: 4px; max-width: 90%; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000; opacity: .85; }
      #fiche h2 { margin: 6px 0 2px; font-size: 19px; border-left: 4px solid var(--sp); padding: 0 30px 0 8px; }
      #fiche h2 small { display: block; font-weight: 400; font-style: italic; font-size: 13px; opacity: .7; }
      #fiche h3 { margin: 10px 0 4px; font-size: 13px; }
      #fiche .fc-close { position: sticky; top: 6px; float: right; z-index: 2; margin: 6px -6px -34px 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ffffff44; background: rgba(6, 12, 18, .85); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
      #fiche .fc-note { font-size: 11.5px; opacity: .72; margin: 4px 0; }
      #fiche .fc-badge { display: inline-block; padding: 0 4px; border: 1px solid #ffffff55; border-radius: 3px; font: 600 10px/1.4 ui-monospace, monospace; opacity: .8; cursor: help; vertical-align: 1px; }
      #fiche .fc-bar { height: 8px; border-radius: 4px; background: repeating-linear-gradient(90deg, #ffffff33 0 4px, transparent 4px 8px); overflow: hidden; }
      #fiche .fc-bar i { display: block; height: 100%; background: var(--sp); }
      #fiche .fc-range p { margin: 4px 0; }
      #fiche dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 10px 0; }
      #fiche dt { opacity: .65; font-size: 12px; }
      #fiche dd { margin: 0; min-width: 0; }
      #fiche .fc-sound { margin: 10px 0; }
      #fiche .fc-sound button { font: 600 12px system-ui, sans-serif; padding: 5px 10px; border-radius: 14px; border: 1px solid var(--sp); background: transparent; color: #fff; cursor: pointer; }
      #fiche .fc-spectro { position: relative; margin-top: 6px; }
      #fiche .fc-spectro canvas { display: block; width: 100%; height: auto; border-radius: 4px; }
      #fiche .fc-spectro i { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: #fff; opacity: .85; }
      #fiche .fc-axis { position: absolute; left: 4px; top: 2px; font-size: 10px; opacity: .75; }
      #fiche .fc-axis.fc-low { top: auto; bottom: 2px; }
      #fiche .fc-credits { font-size: 11px; opacity: .8; }
      #fiche .fc-credits summary { cursor: pointer; }
      #fiche .fc-credits ul { padding-left: 16px; margin: 4px 0; }
      @media (max-width: 700px) { #fiche { top: auto; bottom: 62px; max-height: 62vh; } }
      #recit { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 6; width: min(820px, calc(100vw - 32px)); text-align: center; color: #f4f1ea; pointer-events: none; font: 500 24px/1.35 system-ui, sans-serif; text-shadow: 0 1px 3px #000, 0 0 14px rgba(0, 0, 0, .8); }
      #recit[hidden] { display: none; }
      body.recit-on #legend { display: none; }
      #recit.projector { font-size: 32px; width: min(1100px, calc(100vw - 32px)); }
      #recit.dome { bottom: 24%; width: min(62vh, calc(100vw - 32px)); }
      #recit .rc-caption { margin: 0 0 6px; text-wrap: balance; }
      #recit .rc-badge { display: inline-block; padding: 0 5px; border: 1px solid #ffffff88; border-radius: 3px; font: 600 .5em/1.5 ui-monospace, monospace; vertical-align: .35em; pointer-events: auto; cursor: help; }
      #recit .rc-meta { margin: 0; font-size: 12px; opacity: .7; }
      body.fiche-open #recit:not(.dome) { width: min(820px, calc(100vw - 440px)); transform: translateX(calc(-50% - 200px)); }
      @media (max-width: 700px) { #recit { font-size: 17px; bottom: 64px; } body.fiche-open #recit { display: none; } }
      #science { position: fixed; top: 12px; left: 12px; z-index: 10; max-width: min(440px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 10px 12px; border: 1px solid #526777; border-radius: 5px; color: #d6e2e8; background: rgba(8, 18, 27, .94); font: 12px/1.5 system-ui, sans-serif; }
      #science[open] ~ #propagation { display: none; }
      #science summary { cursor: pointer; font-weight: 600; }
      #science label { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0; }
      #science p, #science pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="status">la carte du vacarme</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
